# Company Network Simulation — Red/Blue Team Lab
#
# Zone layout:
#   WAN       172.16.1.0/24   simulated internet (attacker lives here)
#   DMZ       192.168.1.0/24  public-facing services (web, dns, mail)
#   Intranet  10.10.0.0/24    internal corporate services (dc, file, db, ws)
#
# The firewall container sits on all three networks and enforces zone policy
# via iptables. All intranet/DMZ traffic must traverse it.
#
# Red team entry point:  attacker  (172.16.1.100)
# Blue team entry point: siem      (192.168.1.200 + 10.10.0.200)

version: "3.9"

networks:
  wan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.1.0/24
          gateway: 172.16.1.254

  dmz:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 192.168.1.0/24

  intranet:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.10.0.0/24

services:

  # ── Attacker (Red Team) ───────────────────────────────────────────────────
  attacker:
    image: kalilinux/kali-rolling
    hostname: attacker
    container_name: attacker
    networks:
      wan:
        ipv4_address: 172.16.1.100
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # gateway to DMZ/Intranet is through the firewall
    command: >
      bash -c "
        ip route replace default via 172.16.1.1 &&
        echo 'nameserver 192.168.1.53' > /etc/resolv.conf || true &&
        sleep infinity
      "

  # ── Firewall ──────────────────────────────────────────────────────────────
  firewall:
    image: debian:12
    hostname: firewall
    container_name: firewall
    networks:
      wan:
        ipv4_address: 172.16.1.1
      dmz:
        ipv4_address: 192.168.1.1
      intranet:
        ipv4_address: 10.10.0.1
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ./configs/firewall/setup.sh:/setup.sh:ro
    command: bash /setup.sh

  # ── DMZ: Web (DVWA — Damn Vulnerable Web Application) ────────────────────
  web:
    image: ghcr.io/digininja/dvwa:latest
    hostname: web
    container_name: web
    networks:
      dmz:
        ipv4_address: 192.168.1.10
    environment:
      DB_SERVER: "192.168.1.11"
      DB_DATABASE: dvwa
      DB_USER: dvwa
      DB_PASSWORD: p@ssw0rd
    depends_on:
      - web-db

  # ── DMZ: Web database (MariaDB for DVWA) ─────────────────────────────────
  web-db:
    image: mariadb:10.11
    hostname: web-db
    container_name: web-db
    networks:
      dmz:
        ipv4_address: 192.168.1.11
    environment:
      MARIADB_ROOT_PASSWORD: "rootpass"
      MARIADB_DATABASE: dvwa
      MARIADB_USER: dvwa
      MARIADB_PASSWORD: "p@ssw0rd"

  # ── DMZ: DNS ──────────────────────────────────────────────────────────────
  dns:
    image: internetsystemsconsortium/bind9:9.18
    hostname: dns
    container_name: dns
    networks:
      dmz:
        ipv4_address: 192.168.1.53
    volumes:
      - ./configs/dns/named.conf:/etc/bind/named.conf:ro
      - ./configs/dns/zones:/etc/bind/zones:ro

  # ── DMZ: Mail (Postfix — intentionally permissive relay for training) ─────
  mail:
    image: debian:12
    hostname: mail
    container_name: mail
    networks:
      dmz:
        ipv4_address: 192.168.1.25
    command: >
      bash -c "
        apt-get update -qq &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y postfix -qq &&
        postconf -e 'inet_interfaces = all' &&
        postconf -e 'mydestination = corp.local, localhost' &&
        postconf -e 'mynetworks = 0.0.0.0/0' &&
        postconf -e 'smtpd_relay_restrictions = permit_mynetworks, defer_unauth_destination' &&
        service postfix start &&
        sleep infinity
      "

  # ── Intranet: Domain Controller (OpenLDAP) ────────────────────────────────
  dc:
    image: osixia/openldap:1.5.0
    hostname: dc
    container_name: dc
    networks:
      intranet:
        ipv4_address: 10.10.0.10
    environment:
      LDAP_ORGANISATION: "Corp"
      LDAP_DOMAIN: "corp.local"
      LDAP_BASE_DN: "dc=corp,dc=local"
      LDAP_ADMIN_PASSWORD: "Admin1234!"
      LDAP_CONFIG_PASSWORD: "Config1234!"
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "readonly"
      LDAP_READONLY_USER_PASSWORD: "readonly"
    volumes:
      - ./configs/ldap/users.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/users.ldif:ro

  # ── Intranet: File Server (Samba) ─────────────────────────────────────────
  fileserver:
    image: debian:12
    hostname: fileserver
    container_name: fileserver
    networks:
      intranet:
        ipv4_address: 10.10.0.20
    command: >
      bash -c "
        apt-get update -qq &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y samba -qq &&
        useradd -M -s /sbin/nologin smbuser &&
        echo 'smbuser:Password123' | chpasswd &&
        (echo 'Password123'; echo 'Password123') | smbpasswd -a smbuser -s &&
        mkdir -p /srv/share /srv/confidential &&
        chmod 777 /srv/share &&
        chmod 750 /srv/confidential &&
        cp /configs/samba/smb.conf /etc/samba/smb.conf &&
        smbd --foreground --no-process-group
      "
    volumes:
      - ./configs/samba/smb.conf:/configs/samba/smb.conf:ro

  # ── Intranet: Corporate Database (MySQL) ──────────────────────────────────
  db:
    image: mysql:8.0
    hostname: db
    container_name: db
    networks:
      intranet:
        ipv4_address: 10.10.0.30
    environment:
      MYSQL_ROOT_PASSWORD: "toor"
      MYSQL_DATABASE: "corpdb"
      MYSQL_USER: "appuser"
      MYSQL_PASSWORD: "apppass123"
    volumes:
      - ./configs/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # ── Intranet: Workstation ─────────────────────────────────────────────────
  workstation:
    image: ubuntu:22.04
    hostname: workstation
    container_name: workstation
    networks:
      intranet:
        ipv4_address: 10.10.0.100
    command: >
      bash -c "
        ip route replace default via 10.10.0.1 || true &&
        sleep infinity
      "

  # ── Blue Team: SIEM / Monitor (spans DMZ + Intranet) ─────────────────────
  siem:
    image: debian:12
    hostname: siem
    container_name: siem
    networks:
      dmz:
        ipv4_address: 192.168.1.200
      intranet:
        ipv4_address: 10.10.0.200
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: >
      bash -c "
        apt-get update -qq &&
        DEBIAN_FRONTEND=noninteractive apt-get install -y tcpdump suricata iproute2 -qq &&
        sleep infinity
      "

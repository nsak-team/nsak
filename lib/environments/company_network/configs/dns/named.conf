options {
    directory "/var/cache/bind";
    recursion yes;
    allow-recursion { any; };
    forwarders { 8.8.8.8; 1.1.1.1; };
    dnssec-validation no;
    listen-on { any; };
};

zone "corp.local" {
    type master;
    file "/etc/bind/zones/corp.local.zone";
};

zone "1.168.192.in-addr.arpa" {
    type master;
    file "/etc/bind/zones/192.168.1.rev";
};

zone "0.10.10.in-addr.arpa" {
    type master;
    file "/etc/bind/zones/10.10.0.rev";
};

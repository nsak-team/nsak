[global]
   workgroup = CORP
   server string = Corp File Server
   security = user
   map to guest = Bad User
   log level = 1

[public]
   comment = Public Share — no authentication required
   path = /srv/share
   browseable = yes
   writable = yes
   guest ok = yes
   create mask = 0777

[confidential]
   comment = Confidential — employees only
   path = /srv/confidential
   browseable = yes
   writable = yes
   valid users = smbuser
   create mask = 0640

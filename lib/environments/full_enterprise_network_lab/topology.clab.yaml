name: enterprise-network-lab2

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  Enterprise Network Lab 2 — Acme Corp AG  /  lab.local                     │
# │                                                                             │
# │  Authorized Recon & Enumeration Training Lab                                │
# │                                                                             │
# │  WAN  10.0.1.0/24                                                           │
# │  ┌─────────────────────────────────────────────────────────────────────┐    │
# │  │  [internet-client]  10.0.1.10   — external attacker perspective     │    │
# │  └────────────────┬────────────────────────────────────────────────────┘    │
# │                   │ wan-br                                                  │
# │              [firewall]  eth1:10.0.1.1 / eth2:172.16.1.1 / eth3:192.168.10.1│
# │         ┌─────────┤──────────────────────────────────┐                     │
# │         │ dmz-br  │                              lan-br                    │
# │  DMZ  172.16.1.0/24                    LAN  192.168.10.0/24                │
# │  ┌──────────────────────┐     ┌──────────────────────────────────────────┐  │
# │  │  web      .10  80,443│     │  dc01  .5  53,88,135,389,445,636,3268   │  │
# │  │  dns      .20  53    │     │  db    .10  3306                        │  │
# │  │  mail     .30  25,143│     │  fileserver .20  22,139,445             │  │
# │  │  jump     .40  22    │     │  wiki  .30  3000,2222                   │  │
# │  │  nsak    .200  (obs) │     │  monitor .50  9090,9100                 │  │
# │  └──────────────────────┘     │  alice .100  22,3389,5985,445          │  │
# │                               │  bob   .101  22,3389,5985,445          │  │
# │                               │  nsak .200  (reconnaissance node)      │  │
# │                               └──────────────────────────────────────────┘  │
# │                                                                             │
# │  Firewall policy (iptables):                                               │
# │    WAN → DMZ  : 80/443→web, 53→dns, 25/587→mail, 22→jump only             │
# │    WAN → LAN  : BLOCKED                                                    │
# │    DMZ → LAN  : web→db(3306), mail→dc01(25), jump→ssh(22) only            │
# │    LAN → DMZ  : ALLOWED (employees browse DMZ services)                    │
# │    LAN → WAN  : HTTP/HTTPS only via NAT                                    │
# │    LAN → LAN  : ALLOWED                                                    │
# │                                                                             │
# │  Domain: LAB / lab.local                                                   │
# │  Admin:  Administrator / Password123!                                      │
# │  Users:  jsmith, bjones, mwilson, dtaylor, svc_backup, svc_web            │
# │                                                                             │
# │  Prerequisites:                                                             │
# │    sudo ip link add wan-br type bridge && sudo ip link set wan-br up        │
# │    sudo ip link add dmz-br type bridge && sudo ip link set dmz-br up        │
# │    sudo ip link add lan-br type bridge && sudo ip link set lan-br up        │
# │    docker build -t nsak:latest .                                            │
# │                                                                             │
# │  Deploy:  sudo containerlab deploy -t topology.clab.yaml                   │
# │  Destroy: sudo containerlab destroy -t topology.clab.yaml                  │
# │  Verify:  python3 verify.py                                                │
# │  Shell:   docker exec -it clab-enterprise-network-lab2-nsak bash           │
# │  Sniff:   sudo tcpdump -i lan-br -n                                        │
# │                                                                             │
# │  Credentials:                                                               │
# │    SSH jump        padmin        / JumpH0st!                                │
# │    SSH fileserver  fsadmin       / FileS3rv3r!                              │
# │    SSH alice       jsmith        / Password123!                             │
# │    SSH bob         bjones        / Password123!                             │
# │    MariaDB root    root          / R00tP@ssw0rd!                            │
# │    MariaDB app     appuser       / apppass                                  │
# │    AD              Administrator / Password123!                             │
# └─────────────────────────────────────────────────────────────────────────────┘

topology:

  nodes:

    # ── L2 Bridges ───────────────────────────────────────────────────────────────
    wan-br:
      kind: bridge
    dmz-br:
      kind: bridge
    lan-br:
      kind: bridge

    # ── External Segment (WAN 10.0.1.0/24) ───────────────────────────────────────
    # Simulates the external internet. Only sees what the firewall exposes in DMZ.
    # Use this node to practice external reconnaissance.
    #
    # Reachable from here (through firewall):
    #   172.16.1.10:80,443   web (HTTP/HTTPS)
    #   172.16.1.20:53       dns (DNS queries, AXFR)
    #   172.16.1.30:25,587   mail (SMTP)
    #   172.16.1.40:22       jump (SSH)
    internet-client:
      kind: linux
      image: alpine:3.19
      cmd: tail -f /dev/null
      cap-add:
        - NET_ADMIN
      exec:
        - apk add --no-cache iproute2 curl bind-tools nmap netcat-openbsd openssl
        - ip addr add 10.0.1.10/24 dev eth1
        - ip route replace default via 10.0.1.1

    # ── Firewall (Alpine + iptables) ──────────────────────────────────────────────
    # Tri-homed router/firewall: eth1=WAN, eth2=DMZ, eth3=LAN.
    # All inter-zone traffic is filtered here.
    firewall:
      kind: linux
      image: alpine:3.19
      cmd: tail -f /dev/null
      cap-add:
        - NET_ADMIN
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - apk add --no-cache iptables iproute2
        - ip addr add 10.0.1.1/24 dev eth1
        - ip addr add 172.16.1.1/24 dev eth2
        - ip addr add 192.168.10.1/24 dev eth3
        # Default FORWARD policy: drop everything not explicitly allowed
        - iptables -P FORWARD DROP
        # Allow established/related connections (stateful)
        - iptables -A FORWARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        # WAN → DMZ: only specific services
        - iptables -A FORWARD -i eth1 -o eth2 -d 172.16.1.10 -p tcp -m multiport --dports 80,443 -j ACCEPT
        - iptables -A FORWARD -i eth1 -o eth2 -d 172.16.1.20 -p udp --dport 53 -j ACCEPT
        - iptables -A FORWARD -i eth1 -o eth2 -d 172.16.1.20 -p tcp --dport 53 -j ACCEPT
        - iptables -A FORWARD -i eth1 -o eth2 -d 172.16.1.30 -p tcp -m multiport --dports 25,587 -j ACCEPT
        - iptables -A FORWARD -i eth1 -o eth2 -d 172.16.1.40 -p tcp --dport 22 -j ACCEPT
        # WAN → LAN: BLOCKED (no rules = default DROP)
        # DMZ → LAN: restricted service-to-service paths only
        - iptables -A FORWARD -i eth2 -o eth3 -s 172.16.1.10 -d 192.168.10.10 -p tcp --dport 3306 -j ACCEPT
        - iptables -A FORWARD -i eth2 -o eth3 -s 172.16.1.30 -d 192.168.10.5  -p tcp --dport 25  -j ACCEPT
        - iptables -A FORWARD -i eth2 -o eth3 -s 172.16.1.40 -p tcp --dport 22 -j ACCEPT
        # LAN → DMZ: allow (employees use DMZ services)
        - iptables -A FORWARD -i eth3 -o eth2 -j ACCEPT
        # LAN → WAN: HTTP/HTTPS only, with NAT
        - iptables -A FORWARD -i eth3 -o eth1 -p tcp -m multiport --dports 80,443 -j ACCEPT
        - iptables -t nat -A POSTROUTING -s 192.168.10.0/24 -o eth1 -j MASQUERADE
        - iptables -t nat -A POSTROUTING -s 172.16.1.0/24  -o eth1 -j MASQUERADE

    # ─────────────────────────────────────────────────────────────────────────────
    #  DMZ Nodes  (172.16.1.0/24)
    # ─────────────────────────────────────────────────────────────────────────────

    # ── DMZ: Web Server (nginx) ───────────────────────────────────────────────────
    # Public corporate website for Acme Corp AG.
    #   80/tcp   HTTP   nginx/1.25.3
    #   443/tcp  HTTPS  nginx/1.25.3, self-signed cert
    #
    # Recon findings:
    #   Server: nginx/1.25.3
    #   TLS cert: CN=web.lab.local, O=Acme Corp AG, OU=IT Operations
    #             SAN: web.lab.local, acmecorp.lab.local, www.lab.local
    #   /robots.txt: Disallow /admin, /backup, /api, /internal
    #   /api/v1/status: {"status":"ok","version":"1.3.2","env":"production"}
    #   X-Powered-By: PHP/8.2.7  (fake header for recon noise)
    web:
      kind: linux
      image: nginx:alpine
      cap-add:
        - NET_ADMIN
      binds:
        - scripts/web_setup.sh:/web_setup.sh:ro
      exec:
        - apk add --no-cache iproute2 openssl
        - ip addr add 172.16.1.10/24 dev eth1
        - ip route replace default via 172.16.1.1
        - sh /web_setup.sh
      ports:
        - "80/tcp"

    # ── DMZ: DNS / Authoritative Resolver ────────────────────────────────────────
    # Authoritative DNS for lab.local zone (BIND9).
    # Zone transfers (AXFR) are permitted from any source — intentional misconfiguration.
    #   53/tcp   DNS (zone transfer, AXFR)
    #   53/udp   DNS (queries)
    #
    # Recon: dig @172.16.1.20 lab.local AXFR  → full zone data, all A/CNAME/MX/TXT
    #        nmap -sU -p 53 172.16.1.20        → confirms DNS service
    dns:
      kind: linux
      image: alpine:3.19
      cmd: tail -f /dev/null
      cap-add:
        - NET_ADMIN
      binds:
        - scripts/dns_setup.sh:/dns_setup.sh:ro
      exec:
        - apk add --no-cache bind bind-tools iproute2
        - ip addr add 172.16.1.20/24 dev eth1
        - ip route replace default via 172.16.1.1
        - sh /dns_setup.sh

    # ── DMZ: Mail Relay (Postfix + Dovecot simulation) ────────────────────────────
    # External SMTP relay and IMAP server for acmecorp.lab.local.
    #   25/tcp   SMTP   Postfix 3.8.x banner, STARTTLS offered, VRFY enabled
    #   587/tcp  SMTP Submission (same banner)
    #   143/tcp  IMAP   Dovecot 2.3.x banner
    #
    # Recon: EHLO → exposes server hostname, capabilities, STARTTLS
    #        VRFY jsmith → 250 jsmith@lab.local  (user enumeration enabled)
    #        VRFY nonexistent → 550 User unknown
    mail:
      kind: linux
      image: alpine:3.19
      cmd: tail -f /dev/null
      cap-add:
        - NET_ADMIN
      binds:
        - scripts/mail_server.py:/mail_server.py:ro
      exec:
        - apk add --no-cache python3 iproute2
        - ip addr add 172.16.1.30/24 dev eth1
        - ip route replace default via 172.16.1.1
        - sh -c 'python3 /mail_server.py &'

    # ── DMZ: Jump Host / SSH Bastion ──────────────────────────────────────────────
    # Administrative SSH bastion — the only externally reachable shell.
    # Internal routes from this host reach the LAN (firewall allows it).
    #   22/tcp   SSH  OpenSSH 9.x, login banner, password auth enabled
    #
    # Credentials: padmin / JumpH0st!
    # Recon: SSH banner reveals OS hint, authorized_keys absent, banner.txt visible
    #        known_hosts in /home/padmin/.ssh reveals internal host IPs
    jump:
      kind: linux
      image: alpine:3.19
      cmd: tail -f /dev/null
      cap-add:
        - NET_ADMIN
      binds:
        - scripts/jump_setup.sh:/jump_setup.sh:ro
      exec:
        - apk add --no-cache openssh iproute2 curl bind-tools nmap
        - ip addr add 172.16.1.40/24 dev eth1
        - ip route replace default via 172.16.1.1
        - sh /jump_setup.sh

    # ─────────────────────────────────────────────────────────────────────────────
    #  LAN Nodes  (192.168.10.0/24)
    # ─────────────────────────────────────────────────────────────────────────────

    # ── LAN: Domain Controller (Samba4 AD / lab.local) ───────────────────────────
    # The Active Directory domain controller for LAB / lab.local.
    # Uses Samba4 — provides genuine AD-compatible LDAP, Kerberos, SMB, and DNS.
    #
    # NOTE: If Samba4 provisioning fails in your container runtime (some kernels
    # block it), the provision script falls back to standalone services:
    #   - OpenLDAP on 389  (with populated lab.local DIT)
    #   - Python Kerberos banner on 88
    #   - Samba standalone on 445
    #
    #   53/tcp+udp   DNS   (lab.local zone, all A/SRV/TXT records)
    #   88/tcp+udp   Kerberos KDC
    #   135/tcp      RPC Endpoint Mapper
    #   139/tcp      NetBIOS Session Service
    #   389/tcp      LDAP  (base DC=lab,DC=local, anonymous read of base attrs)
    #   445/tcp      SMB   (SYSVOL, NETLOGON shares visible to authenticated users)
    #   464/tcp      Kpasswd (Kerberos password change)
    #   636/tcp      LDAPS
    #   3268/tcp     Global Catalog
    #
    # Domain:  LAB  /  lab.local
    # Admin:   Administrator / Password123!
    # Users:   jsmith (Finance), bjones (IT, Domain Admin), mwilson (HR),
    #          dtaylor (IT), svc_backup, svc_web, svc_monitor
    # SPNs:    HTTP/wiki.lab.local (svc_web)
    #          MSSQLSvc/db.lab.local:3306 (svc_backup)
    #          BACKUP/dc01.lab.local (svc_backup)
    dc01:
      kind: linux
      image: alpine:3.19
      cmd: tail -f /dev/null
      cap-add:
        - NET_ADMIN
        - SYS_ADMIN
      sysctls:
        net.ipv6.conf.all.disable_ipv6: 1
      binds:
        - scripts/dc01_provision.sh:/dc01_provision.sh:ro
      exec:
        - apk add --no-cache samba samba-dc openldap-clients krb5 bind-tools iproute2
        - ip addr add 192.168.10.5/24 dev eth1
        - ip route replace default via 192.168.10.1
        - hostname dc01
        - sh /dc01_provision.sh

    # ── LAN: Database Server (MariaDB) ────────────────────────────────────────────
    # Internal application database — used by the web application.
    #   3306/tcp  MySQL / MariaDB 10.x
    #
    # Recon: banner reveals "5.5.5-10.x.x-MariaDB"
    #        SHOW DATABASES; with appuser → appdb, information_schema
    #        Table: appdb.users (id, username, email, password_hash, role)
    #        Table: appdb.sessions, appdb.config
    db:
      kind: linux



    # ── LAN: File Server (Samba shares) ───────────────────────────────────────────
    # Windows-style SMB file shares — a typical internal file server.
    #   22/tcp   SSH  (fsadmin / FileS3rv3r!)
    #   139/tcp  NetBIOS Session Service (Samba)
    #   445/tcp  SMB  / CIFS (Samba 4.x)
    #
    # Shares:
    #   \\FILESERVER\public   → anonymous read  (Company_Policy.txt, brochures)
    #   \\FILESERVER\finance  → auth required   (Q4_Budget.xlsx, Payroll.csv)
    #   \\FILESERVER\it       → auth required   (dc01_build_sheet.txt, infra_creds.kdbx)
    #   \\FILESERVER\backup   → restricted      (ad_backup.tar.gz, db_backup.sql.gz)
    #
    # Recon: smbclient -L //192.168.10.20 -N  → lists public + finance + it
    #        smbmap -H 192.168.10.20           → share names, permissions
    fileserver:
      kind: linux
      image: alpine:3.19
      cmd: tail -f /dev/null
      cap-add:
        - NET_ADMIN
      binds:
        - scripts/fileserver_setup.sh:/fileserver_setup.sh:ro
      exec:
        - apk add --no-cache samba openssh iproute2
        - ip addr add 192.168.10.20/24 dev eth1
        - ip route replace default via 192.168.10.1
        - sh /fileserver_setup.sh

    # ── LAN: Internal Wiki / DevOps (Gitea) ──────────────────────────────────────
    # Internal Git + Wiki + CI/CD platform.
    #   3000/tcp  HTTP  Gitea web UI
    #   2222/tcp  SSH   Git over SSH
    #
    # Recon: Gitea exposes public user list (/admin/users), org list, repo names,
    #        commit history, README files, and CI/CD pipeline configs.
    #        /explore/repos reveals internal project names and descriptions.
    wiki:
      kind: linux
      image: gitea/gitea:latest
      cap-add:
        - NET_ADMIN
      env:
        GITEA__database__DB_TYPE: sqlite3
        GITEA__server__DOMAIN: wiki.lab.local
        GITEA__server__ROOT_URL: "http://wiki.lab.local:3000"
        GITEA__server__HTTP_PORT: "3000"
        GITEA__server__SSH_PORT: "2222"
        GITEA__server__SSH_LISTEN_PORT: "2222"
        GITEA__service__DISABLE_REGISTRATION: "false"
        GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
        GITEA__server__DISABLE_ROUTER_LOG: "true"
        GITEA__log__LEVEL: Warn
      exec:
        - ip addr add 192.168.10.30/24 dev eth1 2>/dev/null || true
        - ip route replace default via 192.168.10.1 2>/dev/null || true

    # ── LAN: Monitoring (Prometheus-like UI) ──────────────────────────────────────
    # Internal monitoring stack — unauthenticated, exposes full topology.
    #   9090/tcp  Prometheus UI  (reveals all scrape targets + labels)
    #   9100/tcp  Node Exporter  (reveals OS metrics, hostname, mount points)
    #
    # Recon: GET /api/v1/targets → JSON with all monitored hosts, IPs, roles
    #        Mentions: dc01, db, fileserver, wiki, alice, bob, firewall
    #        Labels include: hostname, zone, role, department, snmp_community
    monitor:
      kind: linux
      image: alpine:3.19
      cmd: tail -f /dev/null
      cap-add:
        - NET_ADMIN
      binds:
        - scripts/monitor_ui.py:/monitor_ui.py:ro
      exec:
        - apk add --no-cache python3 iproute2
        - ip addr add 192.168.10.50/24 dev eth1
        - ip route replace default via 192.168.10.1
        - sh -c 'python3 /monitor_ui.py &'

    # ── LAN: Workstation alice (Finance dept) ────────────────────────────────────
    # Simulates a Windows 11 workstation — Finance department, user: jsmith.
    #   22/tcp    SSH   (jsmith / Password123!)
    #   445/tcp   SMB   (Samba standalone, null session disabled)
    #   3389/tcp  RDP   (Python banner — realistic X.224/RDP negotiate response)
    #   5985/tcp  WinRM (Python banner — HTTP 401 with Negotiate/Basic challenge)
    alice:
      kind: linux
      image: alpine:3.19
      cmd: tail -f /dev/null
      cap-add:
        - NET_ADMIN
      binds:
        - scripts/ws_services.py:/ws_services.py:ro
      exec:
        - apk add --no-cache openssh samba python3 iproute2 curl bind-tools
        - ip addr add 192.168.10.100/24 dev eth1
        - ip route replace default via 192.168.10.1
        - ssh-keygen -A
        - sh -c 'echo "PasswordAuthentication yes" >> /etc/ssh/sshd_config'
        - sh -c 'echo "Banner /etc/ssh/banner.txt" >> /etc/ssh/sshd_config'
        - sh -c 'printf "Acme Corp AG - Authorized Access Only\nThis system is monitored.\n" > /etc/ssh/banner.txt'
        - adduser -D -s /bin/sh jsmith
        - sh -c 'echo "jsmith:Password123!" | chpasswd'
        - mkdir -p /home/jsmith/Documents /home/jsmith/Desktop
        - sh -c 'echo "Q3 2024 Finance Report - CONFIDENTIAL" > /home/jsmith/Documents/Q3_Finance.txt'
        - sh -c 'echo "DOMAIN=LAB\nUSER=jsmith\nHOME=\\\\FILESERVER\\finance" > /home/jsmith/Desktop/drive_mappings.txt'
        - /usr/sbin/sshd
        - sh -c 'python3 /ws_services.py --hostname ALICE --domain LAB &'

    # ── LAN: Workstation bob (IT dept) ───────────────────────────────────────────
    # Simulates a Windows 11 workstation — IT department, user: bjones.
    #   22/tcp    SSH   (bjones / Password123!)
    #   445/tcp   SMB   (Samba standalone)
    #   3389/tcp  RDP   (Python banner)
    #   5985/tcp  WinRM (Python banner)
    bob:
      kind: linux
      image: alpine:3.19
      cmd: tail -f /dev/null
      cap-add:
        - NET_ADMIN
      binds:
        - scripts/ws_services.py:/ws_services.py:ro
      exec:
        - apk add --no-cache openssh samba python3 iproute2 curl bind-tools
        - ip addr add 192.168.10.101/24 dev eth1
        - ip route replace default via 192.168.10.1
        - ssh-keygen -A
        - sh -c 'echo "PasswordAuthentication yes" >> /etc/ssh/sshd_config'
        - sh -c 'echo "Banner /etc/ssh/banner.txt" >> /etc/ssh/sshd_config'
        - sh -c 'printf "Acme Corp AG - Authorized Access Only\nThis system is monitored.\n" > /etc/ssh/banner.txt'
        - adduser -D -s /bin/sh bjones
        - sh -c 'echo "bjones:Password123!" | chpasswd'
        - mkdir -p /home/bjones/Documents /home/bjones/Scripts
        - sh -c 'echo "dc01=192.168.10.5\nfileserver=192.168.10.20\ndb=192.168.10.10" > /home/bjones/Scripts/hosts.txt'
        - sh -c 'echo "# AD admin tooling" > /home/bjones/Scripts/README.txt'
        - /usr/sbin/sshd
        - sh -c 'python3 /ws_services.py --hostname BOB --domain LAB &'

    # ── NSAK — Swiss Army Knife (Reconnaissance Node) ────────────────────────────
    # Your reconnaissance platform. Dual-homed:
    #   eth1 → LAN  192.168.10.200  (full visibility into internal network)
    #   eth2 → DMZ  172.16.1.200   (visibility into DMZ)
    #
    # From LAN interface: reach dc01, db, fileserver, wiki, monitor, alice, bob
    # From DMZ interface: reach web, dns, mail, jump
    #
    # Prerequisite: docker build -t nsak:latest .   (from project root)
    #
    # Quickstart:
    #   docker exec -it clab-enterprise-network-lab2-nsak bash
    #   nsak drill execute discover_hosts --interface eth1
    #   nsak drill execute discover_hosts --interface eth2
    nsak:
      kind: linux
      image: nsak:latest
      entrypoint: /usr/bin/tail
      cmd: "-f /dev/null"
      cap-add:
        - NET_ADMIN
        - NET_RAW
      env:
        NSAK_BASE_PATH: /nsak
      exec:
        - ip addr add 192.168.10.200/24 dev eth1
        - ip addr add 172.16.1.200/24   dev eth2
        - ip route replace default via 192.168.10.1

  links:
    # ── WAN segment
    - endpoints: ["internet-client:eth1", "wan-br:ic"]
    - endpoints: ["firewall:eth1",        "wan-br:fw-wan"]
    # ── DMZ segment
    - endpoints: ["firewall:eth2",        "dmz-br:fw-dmz"]
    - endpoints: ["web:eth1",             "dmz-br:web"]
    - endpoints: ["dns:eth1",             "dmz-br:dns"]
    - endpoints: ["mail:eth1",            "dmz-br:mail"]
    - endpoints: ["jump:eth1",            "dmz-br:jump"]
    - endpoints: ["nsak:eth2",            "dmz-br:nsak-dmz"]
    # ── LAN segment
    - endpoints: ["firewall:eth3",        "lan-br:fw-lan"]
    - endpoints: ["dc01:eth1",            "lan-br:dc01"]
    - endpoints: ["db:eth1",              "lan-br:db"]
    - endpoints: ["fileserver:eth1",      "lan-br:fs"]
    - endpoints: ["wiki:eth1",            "lan-br:wiki"]
    - endpoints: ["monitor:eth1",         "lan-br:monitor"]
    - endpoints: ["alice:eth1",            "lan-br:alice"]
    - endpoints: ["bob:eth1",             "lan-br:bob"]
    - endpoints: ["nsak:eth1",            "lan-br:nsak-lan"]

all:
  vars:
    # The generated inventory is assumed to be used from the clab host.
    # Hence no http proxy should be used. Therefore we make sure the http
    # module does not attempt using any global http proxy.
    ansible_httpapi_use_proxy: false
  children:
    bridge:
      hosts:
        clab-enterprise-network-lab-dmz-br:
          ansible_host: 
        clab-enterprise-network-lab-lan-br:
          ansible_host: 
        clab-enterprise-network-lab-wan-br:
          ansible_host: 
    linux:
      hosts:
        clab-enterprise-network-lab-db:
          ansible_host: 172.20.20.7
        clab-enterprise-network-lab-dns:
          ansible_host: 172.20.20.4
        clab-enterprise-network-lab-firewall:
          ansible_host: 172.20.20.2
        clab-enterprise-network-lab-internet-client:
          ansible_host: 172.20.20.9
        clab-enterprise-network-lab-nsak:
          ansible_host: 172.20.20.3
        clab-enterprise-network-lab-web:
          ansible_host: 172.20.20.8
        clab-enterprise-network-lab-ws1:
          ansible_host: 172.20.20.6
        clab-enterprise-network-lab-ws2:
          ansible_host: 172.20.20.5
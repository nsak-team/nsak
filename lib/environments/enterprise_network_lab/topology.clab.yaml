name: enterprise-network-lab

# ┌──────────────────────────────────────────────────────────────────┐
# │  MVP Enterprise Network Lab – Stufe 1                             │
# │                                                                    │
# │  internet-client (203.0.113.100)                                   │
# │        │                                                           │
# │    [wan-br]  203.0.113.0/24                                        │
# │        │                                                           │
# │   [firewall]  203.0.113.1 / 172.16.1.1 / 192.168.10.1             │
# │        │                      │                                    │
# │    [dmz-br] 172.16.1.0/24  [lan-br] 192.168.10.0/24               │
# │       ├─ web  172.16.1.10          ├─ db  192.168.10.10           │
# │       ├─ dns  172.16.1.20          ├─ ws1 192.168.10.100          │
# │       └─ nsak eth2=172.16.1.50     ├─ ws2 192.168.10.101          │
# │                                    └─ nsak eth1=192.168.10.50     │
# │                                                                    │
# │  NSAK sits on both LAN and DMZ — mirrors the is_target           │
# │  interfaces of the physical BananaPI R4 device.                  │
# │                                                                    │
# │  Build:    docker build -t nsak:latest .   (project root)        │
# │  Deploy:   sudo containerlab deploy -t topology.clab.yaml        │
# │  Destroy:  sudo containerlab destroy -t topology.clab.yaml       │
# │  Shell:    docker exec -it clab-enterprise-network-lab-nsak bash │
# └──────────────────────────────────────────────────────────────────┘

topology:

  nodes:

    # ── L2 Bridges (shared network segments) ─────────────────────
    wan-br:
      kind: bridge

    dmz-br:
      kind: bridge

    lan-br:
      kind: bridge

    # ── Firewall ──────────────────────────────────────────────────
    # Alpine with iptables.  Default DENY forward, explicit allow
    # rules per segment.  NAT masquerade for LAN/DMZ → WAN.
    firewall:
      kind: linux
      image: alpine:3.19
      cmd: tail -f /dev/null
      cap-add:
        - NET_ADMIN
        - NET_RAW
      sysctls:
        net.ipv4.ip_forward: 1
      exec:
        - apk add --no-cache iptables iproute2
        # Assign IPs (eth1=WAN, eth2=DMZ, eth3=LAN — matches links order)
        - ip addr add 203.0.113.1/24 dev eth1
        - ip addr add 172.16.1.1/24  dev eth2
        - ip addr add 192.168.10.1/24 dev eth3
        # Default deny
        - iptables -P FORWARD DROP
        # Allow return traffic
        - iptables -A FORWARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        # LAN → WAN  and  DMZ → WAN (outbound)
        - iptables -A FORWARD -i eth3 -o eth1 -j ACCEPT
        - iptables -A FORWARD -i eth2 -o eth1 -j ACCEPT
        # LAN → DMZ  (workstation to web/dns)
        - iptables -A FORWARD -i eth3 -o eth2 -j ACCEPT
        # WAN → DMZ: HTTP on web and DNS on dns only
        - iptables -A FORWARD -i eth1 -o eth2 -d 172.16.1.10 -p tcp --dport 80  -j ACCEPT
        - iptables -A FORWARD -i eth1 -o eth2 -d 172.16.1.20 -p udp --dport 53  -j ACCEPT
        - iptables -A FORWARD -i eth1 -o eth2 -d 172.16.1.20 -p tcp --dport 53  -j ACCEPT
        # DMZ → LAN: only MariaDB port (web backend to db)
        - iptables -A FORWARD -i eth2 -o eth3 -d 192.168.10.10 -p tcp --dport 3306 -j ACCEPT
        # NAT masquerade for outbound
        - iptables -t nat -A POSTROUTING -s 172.16.1.0/24   -o eth1 -j MASQUERADE
        - iptables -t nat -A POSTROUTING -s 192.168.10.0/24 -o eth1 -j MASQUERADE

    # ── Internet Client ───────────────────────────────────────────
    # Simulates an external attacker / ordinary internet user.
    internet-client:
      kind: linux
      image: alpine:3.19
      cmd: tail -f /dev/null
      cap-add:
        - NET_ADMIN
      exec:
        - apk add --no-cache curl wget nmap iproute2 bind-tools
        - ip addr add 203.0.113.100/24 dev eth1
        - ip route add 172.16.1.0/24   via 203.0.113.1
        - ip route add 192.168.10.0/24 via 203.0.113.1

    # ── DNS ───────────────────────────────────────────────────────
    # dnsmasq serving the lab.local zone.
    # Forwards unknown queries to 8.8.8.8.
    dns:
      kind: linux
      image: alpine:3.19
      cmd: tail -f /dev/null
      cap-add:
        - NET_ADMIN
      exec:
        - apk add --no-cache dnsmasq iproute2
        - ip addr add 172.16.1.20/24 dev eth1
        - ip route replace default via 172.16.1.1
        - >-
          dnsmasq
          --port=53
          --no-resolv
          --server=8.8.8.8
          --address=/firewall.lab.local/172.16.1.1
          --address=/web.lab.local/172.16.1.10
          --address=/dns.lab.local/172.16.1.20
          --address=/db.lab.local/192.168.10.10
          --address=/ws1.lab.local/192.168.10.100
          --address=/ws2.lab.local/192.168.10.101
          --log-queries

    # ── Web Server ────────────────────────────────────────────────
    # nginx in the DMZ — reachable from WAN:80 via firewall.
    web:
      kind: linux
      image: nginx:alpine
      cap-add:
        - NET_ADMIN
      exec:
        - apk add --no-cache iproute2
        - ip addr add 172.16.1.10/24 dev eth1
        - ip route replace default via 172.16.1.1

    # ── Database ──────────────────────────────────────────────────
    # MariaDB in the LAN.  Reachable from workstation (same subnet)
    # and from web (DMZ→LAN:3306 allowed by firewall).
    db:
      kind: linux
      image: mariadb:lts
      env:
        MARIADB_ROOT_PASSWORD: toor
        MARIADB_DATABASE: appdb
        MARIADB_USER: appuser
        MARIADB_PASSWORD: apppass
      exec:
        - ip addr add 192.168.10.10/24 dev eth1

    # ── Workstations ──────────────────────────────────────────────────
    # Two internal clients — enable MITM scenarios between two LAN
    # participants (ARP spoofing ws1 ↔ ws2).
    ws1:
      kind: linux
      image: alpine:3.19
      cmd: tail -f /dev/null
      cap-add:
        - NET_ADMIN
      env:
        PYTHONUNBUFFERED: "1"
      exec:
        - apk add --no-cache curl wget nmap iproute2 mariadb-client bind-tools python3
        - ip addr add 192.168.10.100/24 dev eth1
        - ip route add 172.16.1.0/24  via 192.168.10.1
        - ip route add 203.0.113.0/24 via 192.168.10.1
        - sh -c 'echo  | base64 -d > /tcp_client.py'

    ws2:
      kind: linux
      image: alpine:3.19
      cmd: tail -f /dev/null
      cap-add:
        - NET_ADMIN
      env:
        PYTHONUNBUFFERED: "1"
      exec:
        - apk add --no-cache curl wget nmap iproute2 mariadb-client bind-tools busybox-extras python3
        - ip addr add 192.168.10.101/24 dev eth1
        - ip route add 172.16.1.0/24  via 192.168.10.1
        - ip route add 203.0.113.0/24 via 192.168.10.1
        - sh -c 'echo  | base64 -d > /tcp_server.py'

    # ── NSAK ─────────────────────────────────────────────────────────
    # Swiss Army Knife Network Sniffer — sits on both LAN (eth1) and
    # DMZ (eth2), mirroring the is_target interfaces of the physical
    # BananaPI R4 device.
    #
    # Prerequisite: build the image locally:
    #   docker build -t nsak:latest .
    #
    # Run a scenario:
    #   docker exec -it clab-enterprise-network-lab-nsak bash
    #   nsak scenario execute <scenario> [--option value]
    nsak:
      kind: linux
      image: nsak:latest
      # Override the image entrypoint (nsak scenario execute) so the
      # container stays alive for interactive use.
      entrypoint: /usr/bin/tail
      cmd: "-f /dev/null"
      cap-add:
        - NET_ADMIN
        - NET_RAW
      env:
        # Points to the WORKDIR from the Dockerfile (COPY . . → /nsak/)
        NSAK_BASE_PATH: /nsak
      exec:
        # eth1 = LAN (is_target: attacks against ws1/ws2/db)
        - ip addr add 192.168.10.50/24 dev eth1
        # eth2 = DMZ (is_target: attacks against web/dns)
        - ip addr add 172.16.1.50/24 dev eth2
        # Route to WAN via firewall (LAN interface as default gateway)
        - ip route add 203.0.113.0/24 via 192.168.10.1

  links:
    # WAN segment (203.0.113.0/24)
    - endpoints: ["firewall:eth1",       "wan-br:fw1"]
    - endpoints: ["internet-client:eth1","wan-br:ic"]
    # DMZ segment (172.16.1.0/24)
    - endpoints: ["firewall:eth2",       "dmz-br:fw2"]
    - endpoints: ["web:eth1",            "dmz-br:web"]
    - endpoints: ["dns:eth1",            "dmz-br:dns"]
    - endpoints: ["nsak:eth2",           "dmz-br:nsak1"]
    # LAN segment (192.168.10.0/24)
    - endpoints: ["firewall:eth3",       "lan-br:fw3"]
    - endpoints: ["db:eth1",             "lan-br:db"]
    - endpoints: ["ws1:eth1",            "lan-br:ws1"]
    - endpoints: ["ws2:eth1",            "lan-br:ws2"]
    - endpoints: ["nsak:eth1",           "lan-br:nsak2"]

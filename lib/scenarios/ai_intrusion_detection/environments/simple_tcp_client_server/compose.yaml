version: "3.9"

services:
  ai_intrusion_detection:
    image: nsak/scenario/ai_intrusion_detection:latest
    command: [
      "ai_intrusion_detection",
      "--interface", "eth1"
    ]
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      podman:
      testnet:
        ipv4_address: 10.10.100.50
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  malcom:
    image: nsak/scenario/mitm:latest
    command: [
      "mitm",
      "--interface", "eth0"
    ]
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      testnet:
        ipv4_address: 10.10.100.30
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped


networks:
  podman:
    external: true

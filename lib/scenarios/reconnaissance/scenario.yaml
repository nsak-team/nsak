scenarios:
  reconnaissance:
    name: Reconnaissance
    author: gausf1@bfh.ch
    repository: https://gitlab.ti.bfh.ch/gausf1-vonal3/swiss-army-knife-network-sniffer

    drills:
      - discover_hosts
      - port_scan
      - enumerate_services

    environments:

    dependencies:
      system:
        - dsniff
        - iptables
      python:
        - scapy

    interface:
      arguments:
        interface:
          type: str
          default: null
        subnet:
          type: str
          default: null
      return_type: ReconnaissanceScenarioResult

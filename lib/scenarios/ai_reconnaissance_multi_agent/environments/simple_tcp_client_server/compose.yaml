version: "3.9"

services:
  malcom:
    image: nsak/scenario/ai_reconnaissance:latest
    command: [
      "ai_reconnaissance",
      "--interface", "eth1",
      "--interactive", "0",
    ]
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      podman:
      testnet:
        ipv4_address: 10.10.100.30
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

networks:
  podman:
    external: true
